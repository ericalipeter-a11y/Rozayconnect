name: Flutter checks

on:
  pull_request:
  push:
    branches: [main]

jobs:
  flutter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - run: dart format lib test
      - run: flutter analyze
      - run: flutter test
      # This repository currently contains Flutter app code but no Android
      # platform scaffold. Generate it in CI before producing the APK.
      - run: flutter create --platforms=android --org com.rozayconnect --project-name rozay_connect .
      - run: flutter build apk --release
