name: Flutter quality checks and Android build

on:
  push:
    branches: [main, "codex/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Format Dart code and save generated lockfile
        run: |
          dart format .
          git add lib/auth_screen.dart lib/home_screen.dart lib/moderation_screen.dart lib/rozay_backend.dart lib/seller_portal_screen.dart test/widget_test.dart pubspec.lock
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Apply Dart formatting and commit dependency lockfile"
            git push origin HEAD:${GITHUB_HEAD_REF:-${GITHUB_REF_NAME}}
          fi
      - name: Analyze
        run: flutter analyze
      - name: Run tests
        run: flutter test

  android:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Android platform project
        run: flutter create --platforms=android .
      - name: Build Android APK
        run: flutter build apk --release
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: rozay-connect-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
